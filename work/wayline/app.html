<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Wayline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="pass.css">
<link rel="stylesheet" href="days.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body data-tab="trip">
<div class="app" id="app">

  <div class="statusbar" aria-hidden="true">
    <span class="time">9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="0.8"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.8"/><rect x="10" y="3" width="3" height="9" rx="0.8"/><rect x="15" y="0" width="3" height="12" rx="0.8"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.2 5.9 9a3 3 0 0 1 4.2 0L8 11.2Zm0-3.6c1.4 0 2.7.5 3.7 1.5l1.3-1.3A7 7 0 0 0 8 4.9 7 7 0 0 0 3 6.8l1.3 1.3c1-1 2.3-1.5 3.7-1.5Zm0-3.6c2.3 0 4.4.9 6 2.4l1.3-1.3A10.6 10.6 0 0 0 8 1.3 10.6 10.6 0 0 0 .7 4.2L2 5.5a8.7 8.7 0 0 1 6-2.4Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.6" fill="none" stroke="currentColor" stroke-opacity=".38"/><rect x="2.2" y="2.2" width="17.2" height="8.6" rx="2.1"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill-opacity=".45"/></svg>
    </span>
  </div>

  <main class="screens">

    <!-- TRIP -->
    <section class="screen is-active trip" id="screen-trip" data-screen="trip" aria-label="Trip">
      <div class="globe" id="globe">
        <span class="glabel" id="lb-ber">Berlin</span>
        <span class="glabel" id="lb-hnd">Tokyo</span>
      </div>
      <div class="trip-info">
        <div class="ti-head">
          <div>
            <h1 class="city">Tokyo</h1>
            <p class="when">Thu 3 – Mon 14 Dec</p>
          </div>
          <div class="count"><span class="n">12</span><span class="u">days to go</span></div>
        </div>
        <div class="flight">
          <div class="leg"><span class="tm">07:40</span><span class="ap">BER · Berlin</span></div>
          <div class="mid"><span class="dur">11h 50m</span><span class="track"><i></i><svg class="pl" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12 L14.5 10.4 L11.2 3.6 L9.4 3.6 L11 10.4 L6.2 10.4 L4.4 7.4 L3 7.4 L4 10.4 L4 13.6 L3 16.6 L4.4 16.6 L6.2 13.6 L11 13.6 L9.4 20.4 L11.2 20.4 L14.5 13.6 Z"/></svg><i></i></span><span class="dur">Nonstop</span></div>
          <div class="leg r"><span class="tm">08:30<sup>+1</sup></span><span class="ap">HND · Tokyo</span></div>
        </div>
        <dl class="facts">
          <div><dt>Terminal</dt><dd>1</dd></div>
          <div><dt>Gate</dt><dd>B12</dd></div>
          <div><dt>Seat</dt><dd>14A</dd></div>
          <div><dt>Boards</dt><dd>07:05</dd></div>
        </dl>
        <button class="pill" type="button" data-go="pass">Boarding pass</button>
      </div>
    </section>

    <!-- PASS (filled by pass.js) -->
    <section class="screen" id="screen-pass" data-screen="pass" aria-label="Boarding pass"></section>

    <!-- DAYS (filled by days.js) -->
    <section class="screen" id="screen-days" data-screen="days" aria-label="Days"></section>

  </main>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button class="tab is-on" type="button" role="tab" data-tab="trip" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
      <span>Trip</span>
    </button>
    <button class="tab" type="button" role="tab" data-tab="pass" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17v3.3a2.2 2.2 0 0 0 0 4.4v3.3h-17v-3.3a2.2 2.2 0 0 0 0-4.4z"/><path d="M14.5 6.5v2.2M14.5 11v2M14.5 15.3v2.2"/></svg>
      <span>Pass</span>
    </button>
    <button class="tab" type="button" role="tab" data-tab="days" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Days</span>
    </button>
  </nav>
  <div class="home-ind" aria-hidden="true"></div>

</div>
<script type="module" src="app.js"></script>
<script defer src="pass.js"></script>
<script defer src="days.js"></script>
</body>
</html>
